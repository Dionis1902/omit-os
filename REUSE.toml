# SPDX-FileCopyrightText: 2026 Omit OS contributors
# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Licensing information for files that carry no header of their own.
# Source files state their licence in their first lines; see COPYING for
# which licence applies where.

version = 1

# Documentation, including the top-level documents and the screenshots.
# Assets that are not code are listed for people in ATTRIBUTION.md, which
# must agree with this file.
[[annotations]]
path = ["README.md", "COPYING", "CONTRIBUTING.md", "TRADEMARKS.md", "ATTRIBUTION.md", "IP_POLICY.md", "PROVENANCE.md", "docs/**", "drivers/linux/README.md", "compat/linux-kpi/README.md"]
SPDX-FileCopyrightText = "2026 Omit OS contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Build configuration and CI.
[[annotations]]
path = [
    "Cargo.toml",
    "Cargo.lock",
    "**/Cargo.toml",
    "rust-toolchain.toml",
    ".gitignore",
    ".cargo/**",
    ".github/**",
    "tools/dco-baseline",
]
SPDX-FileCopyrightText = "2026 Omit OS contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The Inter typeface, as bitmap fonts drawn from it by tools/gen-font.py.
# A rendering of the font is a derivative of it and stays under its
# licence. See ATTRIBUTION.md.
[[annotations]]
path = "libs/gfx/fonts/*.omf"
SPDX-FileCopyrightText = "2016-2023 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

# The interface's glyph icons: the project's own drawings (the paths in
# icons.json) and their rendering by tools/gen-icons.js. Part of the SDK.
[[annotations]]
path = "libs/gfx/icons/**"
SPDX-FileCopyrightText = "2026 Omit OS contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The design system's pictures: wallpapers and program icons, as
# drawings and as rendered by tools/gen-art.js. Artwork, under the
# licence of the project's artwork — not that of the library they are
# built into; see COPYING.
[[annotations]]
path = "libs/gfx/art/**"
SPDX-FileCopyrightText = "2026 Omit OS contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Imported Linux driver code. The files are kept exactly as upstream has
# them, including their own notices; three of them use the older spelling
# "GPL-2.0+" of the identifier GPL-2.0-or-later, which is restated here
# so that tools find the licence text.
[[annotations]]
path = "drivers/linux/misc/pvpanic/**"
precedence = "override"
SPDX-FileCopyrightText = [
    "2013 Fujitsu",
    "2018 ZTE",
    "2021 Oracle",
]
SPDX-License-Identifier = "GPL-2.0-or-later"
