[workspace]
resolver = "3"
members = [
    "boot",
    "kernel",
    "compat/windows/pe",
    "compat/windows/samples",
    "compat/windows/samples/dll",
    "compat/windows/samples/plugin",
    "compat/windows/win32",
    "libs/abi",
    "libs/acpi",
    "libs/bootproto",
    "libs/elf",
    "libs/ext2",
    "libs/fat",
    "libs/gfx",
    "libs/gpt",
    "libs/hwdb",
    "libs/mm",
    "libs/term",
    "libs/vfs",
    "shell",
    "tools/xtask",
    "userspace/programs",
    "userspace/rt",
]
# Plain `cargo build` / `cargo test` operate on the host-buildable crates only.
# The loader and kernel need bare-metal targets; `cargo xtask` drives those.
default-members = [
    "compat/windows/pe",
    "compat/windows/win32",
    "libs/acpi",
    "libs/bootproto",
    "libs/elf",
    "libs/ext2",
    "libs/fat",
    "libs/gfx",
    "libs/gpt",
    "libs/hwdb",
    "libs/mm",
    "libs/term",
    "libs/vfs",
    "shell",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/dionis1902/omit-os"
rust-version = "1.97"

[workspace.dependencies]
omit-abi = { path = "libs/abi" }
omit-fat = { path = "libs/fat" }
omit-gfx = { path = "libs/gfx" }
omit-gpt = { path = "libs/gpt" }
omit-pe = { path = "compat/windows/pe" }
omit-win32 = { path = "compat/windows/win32" }
omit-acpi = { path = "libs/acpi" }
omit-bootproto = { path = "libs/bootproto" }
omit-elf = { path = "libs/elf" }
omit-ext2 = { path = "libs/ext2" }
omit-hwdb = { path = "libs/hwdb" }
omit-mm = { path = "libs/mm" }
omit-rt = { path = "userspace/rt" }
omit-shell = { path = "shell" }
omit-term = { path = "libs/term" }
omit-vfs = { path = "libs/vfs" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# Every `unsafe` block must carry a `// SAFETY:` justification.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.release]
# Keep line tables so panic backtraces can be resolved with addr2line.
# Debug sections are not loaded into memory by the boot loader.
debug = "line-tables-only"
codegen-units = 1

# User programs are shipped inside the initial ramdisk, where every byte of
# debug information costs RAM at run time.
[profile.dev.package.omit-user-programs]
debug = false
strip = "debuginfo"
opt-level = 1

# Drawing is loops over pixels; without optimisation the desktop is
# unusably slow even in debug builds of everything else.
[profile.dev.package.omit-gfx]
opt-level = 3

[profile.release.package.omit-user-programs]
debug = false
strip = "debuginfo"
