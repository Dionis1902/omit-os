name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Installs the pinned toolchain, components and targets from
      # rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy (host crates)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy (kernel)
        run: cargo clippy --locked -p omit-kernel --target x86_64-unknown-none -- -D warnings
      - name: Clippy (boot loader)
        run: cargo clippy --locked -p omit-boot --target x86_64-unknown-uefi -- -D warnings
      - name: Clippy (userspace)
        run: cargo clippy --locked -p omit-user-programs -p omit-rt --target x86_64-unknown-none -- -D warnings
      - name: Clippy (Windows test programs)
        run: cargo clippy --locked -p omit-win-samples -p omit-win-sample-dll -p omit-win-sample-plugin --target x86_64-pc-windows-msvc -- -D warnings
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -Cpanic=abort
      - name: Host unit tests
        run: cargo test --locked

  licensing:
    name: Licensing (REUSE, per-component licences, dependencies, DCO)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The sign-off check looks at the commits being pushed.
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install reuse and cargo-deny
        run: |
          pipx install reuse
          cargo install cargo-deny --locked --version 0.20.2
      - name: REUSE compliance
        run: reuse lint
      - name: Every source file carries its component's licence
        run: python3 tools/check-licenses.py
      - name: Sources stated for Windows compatibility code; Linux imports listed
        run: python3 tools/check-ip.py
      - name: Dependency licences, per component policy
        run: sh tools/check-deps.sh
      - name: Developer Certificate of Origin sign-offs
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # A pull request is checked against its base, a push against
          # what the branch pointed to before (if that is known here).
          base="${BASE:-$BEFORE}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(cat tools/dco-baseline)"
          fi
          sh tools/check-dco.sh "$base" HEAD

  qemu:
    name: QEMU boot tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf e2fsprogs
      - name: Boot tests (debug)
        run: cargo xtask test
      - name: Boot tests (release)
        run: cargo xtask test --release
      - name: Boot tests (release, baseline CPU without 1 GiB pages/SMEP/SMAP)
        run: cargo xtask test --release --cpu qemu64
      # Hosted runners usually expose KVM. Running on a real CPU covers what
      # emulation cannot: x2APIC mode, an invariant TSC, real timer rates.
      - name: Enable KVM
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KVM is not available on this runner; skipping KVM boot tests"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Boot tests (release, KVM, host CPU)
        if: steps.kvm.outputs.available == 'true'
        run: |
          cargo xtask test --release --accel kvm --cpu host
          grep -a "irq:\|time:\|cpu:" target/omit/release/test-boot.serial.log
      - name: Boot tests (release, from ISO)
        run: cargo xtask test --release --iso
      - name: Build release artifacts (disk image and ISO)
        run: cargo xtask dist
      - name: Upload serial logs and disk image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omit-os-${{ github.sha }}
          path: |
            target/omit/**/*.serial.log
            target/omit/dist/
          if-no-files-found: warn
