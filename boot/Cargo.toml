[package]
name = "omit-boot"
description = "Omit OS UEFI boot loader"
version.workspace = true
edition.workspace = true
license = "GPL-2.0-only"
publish = false
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "omit-boot"
path = "src/main.rs"
test = false
bench = false

[dependencies]
omit-bootproto.workspace = true
omit-elf.workspace = true
# UEFI bindings (MIT OR Apache-2.0). Default features are disabled: the loader
# needs no heap allocator, logger or panic handler from the crate.
uefi = { version = "0.41", default-features = false }

[lints]
workspace = true
