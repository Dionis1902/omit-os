[package]
name = "xtask"
description = "Omit OS build, image, run and test driver"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The `network` test's web server behind TLS: the library the guest's
# client is built on, here with the standard library.
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-rustcrypto = "=0.0.2-alpha"

# FAT filesystem writer for the EFI system partition. `chrono` is disabled so
# no wall-clock timestamps leak into the image (reproducible builds).
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }

# Used to write (and round-trip test) the initial ramdisk archive.
omit-vfs.workspace = true
# The desktop test locates buttons and recognises text with the same code
# the desktop draws with.
omit-gfx.workspace = true
# The partition table of the boot image is built by the same code the
# installer uses.
omit-gpt.workspace = true

[lints]
workspace = true
